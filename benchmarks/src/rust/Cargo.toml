[package]
name = "rust_optimized_benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
# ndarray - start without BLAS for simplicity
ndarray = "0.15"
# nalgebra for geometry-focused linear algebra  
nalgebra = "0.32"
# matrixmultiply for direct GEMM operations
matrixmultiply = "0.3"
# Random number generation
rand = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3

# Removed features for now
